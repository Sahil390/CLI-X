# Website Builder Shared Types
# Used by both TypeScript CLI and Python backend

config:
  global:
    path: ~/.website-builder/config.json
    fields:
      - name: default_provider
        type: string
      - name: auth
        type: dict
      - name: ai
        type: dict
      - name: build
        type: dict

  project:
    file: website-builder.config.json
    fields:
      - name: name
        type: string
        required: true
      - name: template
        type: string
        default: default
      - name: build
        type: object
        required: true
      - name: deploy
        type: object
        required: true

auth:
  providers:
    - github
    - ssh
    - api-key
  token_storage: ~/.website-builder/session.json

build:
  input_dir: src/
  output_dir: dist/

deploy:
  targets:
    - local
    - ssh
    - github
    - vercel
    - netlify

api:
  ai_port: 8420
  oauth_port: 8080
