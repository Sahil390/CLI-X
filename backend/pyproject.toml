[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wb-backend"
version = "0.1.0"
description = "Python backend for website-builder CLI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.2",
    "click>=8.1.7",
    "requests>=2.31.0",
    "paramiko>=3.4.0",
    "google-auth>=2.23.0",
    "openai>=1.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "Pillow>=10.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
